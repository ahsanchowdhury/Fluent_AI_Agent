<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local WP AI Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div>
          <h1>Local WP AI Agent</h1>
          <p id="siteLabel">Loading...</p>
        </div>
        <section class="panel">
          <h2>Status</h2>
          <dl id="statusList"></dl>
        </section>
        <section class="panel">
          <h2>Actions</h2>
          <button id="debugHome">Debug Homepage</button>
          <div class="inline">
            <input id="debugPath" placeholder="wp-admin or support-portal" />
            <button id="debugPathButton">Debug</button>
          </div>
          <button id="syncIndex">Sync Code Memory</button>
          <button id="resetChat">Reset Chat</button>
        </section>
        <section class="panel plugins">
          <h2>Plugins</h2>
          <ul id="pluginsList"></ul>
        </section>
      </aside>
      <section class="chat">
        <div id="messages" class="messages"></div>
        <form id="chatForm" class="composer">
          <textarea id="messageInput" placeholder="Ask about plugin code, debug errors, browser issues, or patches..." rows="3"></textarea>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
