<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local WP AI Agent</title>
    <link rel="icon" href="/agent-icon.svg" type="image/svg+xml" />
    <link rel="mask-icon" href="/agent-icon.svg" color="#0f6cbd" />
    <meta name="theme-color" content="#0f6cbd" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <img src="/agent-icon.svg" alt="" />
          </div>
          <div>
            <h1>WP Agent</h1>
            <p id="siteLabel">Loading...</p>
          </div>
        </div>

        <button id="resetChat" class="new-chat">New Chat</button>

        <section class="panel">
          <h2>Appearance</h2>
          <div class="theme-control" role="group" aria-label="Theme">
            <button id="lightThemeButton" class="theme-button" type="button">Light</button>
            <button id="darkThemeButton" class="theme-button" type="button">Dark</button>
          </div>
        </section>

        <section class="panel conversations-panel">
          <h2>Conversations</h2>
          <ul id="conversationList" class="conversation-list"></ul>
        </section>

        <section class="panel">
          <h2>Status</h2>
          <dl id="statusList"></dl>
        </section>
        <section class="panel plugins">
          <h2>Plugins</h2>
          <ul id="pluginsList"></ul>
        </section>
        <section class="panel themes">
          <h2>Themes</h2>
          <ul id="themesList"></ul>
        </section>
      </aside>
      <section class="chat">
        <header class="chat-header">
          <div>
            <h2>Agent Chat</h2>
            <p>Ask naturally. The agent can inspect code memory, logs, plugins, and local pages.</p>
          </div>
          <span id="syncBadge" class="badge">Checking...</span>
        </header>
        <div id="messages" class="messages"></div>
        <form id="chatForm" class="composer">
          <div id="imagePreviewList" class="image-preview-list" aria-live="polite"></div>
          <div class="composer-box">
            <input id="imageInput" class="sr-only" type="file" accept="image/png,image/jpeg,image/webp" multiple />
            <button id="attachImageButton" class="icon-button" type="button" title="Attach image" aria-label="Attach image">+</button>
            <textarea id="messageInput" placeholder="Ask about plugin code, debug errors, browser issues, or patches..." rows="1"></textarea>
            <div class="composer-actions">
              <button id="summarizeContextButton" class="composer-action-button" type="button">Summarise Context</button>
              <button id="rewriteButton" class="composer-action-button" type="button">Re-Write</button>
              <button id="sendButton" type="submit">Send</button>
            </div>
          </div>
        </form>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
