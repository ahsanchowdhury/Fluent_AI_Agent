<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local WP AI Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div>
            <h1>WP Agent</h1>
            <p id="siteLabel">Loading...</p>
          </div>
        </div>

        <button id="resetChat" class="new-chat">New Chat</button>

        <section class="panel conversations-panel">
          <h2>Conversations</h2>
          <ul id="conversationList" class="conversation-list"></ul>
        </section>

        <section class="panel">
          <h2>Status</h2>
          <dl id="statusList"></dl>
        </section>
        <section class="panel">
          <h2>Actions</h2>
          <button id="debugHome">Debug homepage</button>
          <div class="inline">
            <input id="debugPath" placeholder="wp-admin or support-portal" />
            <button id="debugPathButton">Debug</button>
          </div>
          <button id="formTestButton" class="secondary">Test form</button>
          <button id="syncIndex" class="secondary">Sync code memory</button>
        </section>
        <section class="panel plugins">
          <h2>Plugins</h2>
          <ul id="pluginsList"></ul>
        </section>
        <section class="panel themes">
          <h2>Themes</h2>
          <ul id="themesList"></ul>
        </section>
      </aside>
      <section class="chat">
        <header class="chat-header">
          <div>
            <h2>Agent Chat</h2>
            <p>Ask naturally. The agent can inspect code memory, logs, plugins, and local pages.</p>
          </div>
          <span id="syncBadge" class="badge">Checking...</span>
        </header>
        <div id="messages" class="messages"></div>
        <form id="chatForm" class="composer">
          <div class="composer-box">
            <textarea id="messageInput" placeholder="Ask about plugin code, debug errors, browser issues, or patches..." rows="1"></textarea>
            <button id="sendButton" type="submit">Send</button>
          </div>
        </form>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
